# Värmlands län. The county's name and region (scope) come from meshcore-se-regioner, the
# neighbours from its grannlan.csv and the map area from se-lan.geojson; only what cannot be
# derived is written here. Every key is described in CONTRIBUTING.md.
scb     = "17"
slug    = "värmland"
short   = "Värmland"
site    = ""
checked = 2026-11-18
# Värmland Mesh's own naming, read on https://varmlandmesh.se/ 2026-11-18 (operator decision 2026-11-18: the local format first).
naming  = { format = "SE[kommunkod]-[Plats]", example = "SE1780-KarlstadREP", format_en = "SE[municipality code]-[Place]", source = "https://varmlandmesh.se/", group = "Värmland Mesh" }

# Published by Värmland Mesh on https://varmlandmesh.se/, checked 2026-11-18.
[[channels]]
  name    = "#varmland"
  purpose = "Prat om nätet i Värmland"
  purpose_en = "Talk about the network in Värmland"

# Groups: surveyed 2026-11-18 from meshat.se Regionala sidor, the groups' own sites, ham club sites, the Sweden Mesh Discord invite page, Facebook group titles, GitHub, web search and MeshMapper scope names; 2 active MeshCore group(s) found.
[[groups]]
  name = "Värmland Mesh"
  url  = "https://varmlandmesh.se/"

[[groups]]
  name = "SK4AV Karlstads Sändaramatörer"
  short = "SK4AV"   # the button's text on the county's front page (operator 2026-11-25)
  url  = "https://www.sk4av.se/"
