# Västra Götalands län. The county's name and region (scope) come from meshcore-se-regioner, the
# neighbours from its grannlan.csv and the map area from se-lan.geojson; only what cannot be
# derived is written here. Every key is described in CONTRIBUTING.md.
scb     = "14"
slug    = "västra-götaland"
short   = "Västra Götaland"
site    = ""
checked = 2026-11-18
community = { name = "GBG Mesh", url = "https://gbg-mesh.se/" }   # the county's community site, a button beside "Se kartan" (B-306)
# GBG Mesh's own naming, read on https://gbg-mesh.se/ 2026-11-18 (operator decision 2026-11-18: the local format first).
naming  = { format = "SE-GOT-<Beskrivning>", format_en = "SE-GOT-<Description>", source = "https://gbg-mesh.se/", group = "GBG Mesh" }

# Groups: surveyed 2026-11-18 from meshat.se Regionala sidor, the groups' own sites, ham club sites, the Sweden Mesh Discord invite page, Facebook group titles, GitHub, web search and MeshMapper scope names; 1 active MeshCore group(s) found.
[[groups]]
  name = "GBG Mesh"
  url  = "https://gbg-mesh.se/"

# MeshCore Östra Skaraborg: found by the operator 2026-11-23; an independent local group (Skövde, Hjo, Tidaholm,
# Falköping, Tibro, Karlsborg). Its settings are the county's (se-vgr, EU/UK Narrow), read on its site 2026-11-23.
[[groups]]
  name = "MeshCore Östra Skaraborg"
  url  = "https://meshcoreskaraborg.se/"

# A second community site for the county, beside `community` in the Sverige view's Gemenskap column (operator 2026-11-23).
[[communities]]
  name = "MeshCore Östra Skaraborg"
  url  = "https://meshcoreskaraborg.se/"
