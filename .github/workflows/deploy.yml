# Build the site with Hugo, check it, and (later) deploy it to Cloudflare Pages.
# The deploy step stays off until the domain and the Pages project exist (operator's OK):
# set DEPLOY_ENABLED to "true" as a repository variable then. Until that, every push only builds.
#   dev  → staging, not indexed;  main → production;  pull requests → build and check only.
# Secrets for the deploy: CLOUDFLARE_API_TOKEN (Pages:Edit only) and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      PAGEFIND_VERSION: 1.5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hugo and Pagefind
        run: |
          curl -sSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo && sudo install hugo /usr/local/bin/hugo
          curl -sSLo pagefind.tar.gz "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf pagefind.tar.gz pagefind && sudo install pagefind /usr/local/bin/pagefind
      - name: Check the county files and the functions
        run: npm test
      # The repeaters first heard in the last 7 days (B-362): data/new_repeaters.json for the build, and the
      # first-heard dates so far to static/data/first-seen.json, which the next run reads back from the live
      # site. Throttled against Beacon's rate limit; a failure leaves the page saying the list is missing.
      - name: New repeaters
        run: node scripts/new-repeaters.mjs
      # What the live sitemap says before this deploy, for IndexNow after it (SEO-SV-29).
      - name: Live sitemap before the deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: curl -sfL --max-time 30 https://meshcoresverige.se/sitemap.xml -o "$RUNNER_TEMP/old-sitemap.xml" || true
      - name: Build (staging)
        if: github.ref != 'refs/heads/main'
        env:
          HUGO_PARAMS_NOINDEX: "true"
        run: hugo --gc --minify --baseURL https://staging.meshcoresverige.se/
      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: hugo --gc --minify
      # The link-preview pictures, taken from the built site with live Beacon data: the map pictures for the
      # share addresses (/karta/, /<county>/karta/) and one picture per page (title, a line, the county's
      # numbers). They are written to static/og, and the site is built once more so every page points at its
      # own picture (the template uses static/og/s/<key>.jpg where it exists). The schedule above rebuilds
      # the site every six hours, which keeps the numbers in the pictures current. A failure keeps the map
      # pictures committed in static/og and the site's standard picture on the pages.
      - name: Preview pictures
        continue-on-error: true
        timeout-minutes: 12
        run: |
          npm install --no-save puppeteer-core
          export PUPPETEER=puppeteer-core CHROME="$(command -v google-chrome)"
          node scripts/og-maps.mjs public static/og || echo "some map pictures were not retaken"
          node scripts/og-pages.mjs public static/og/s static/og
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then hugo --gc --minify
          else HUGO_PARAMS_NOINDEX=true hugo --gc --minify --baseURL https://staging.meshcoresverige.se/; fi
      - name: Search index
        run: pagefind --site public
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=meshcoresverige --branch=${{ github.ref_name }} --commit-dirty=true
      # The new and changed URLs to IndexNow (Bing and others; not Google), once the deploy is live.
      - name: IndexNow
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: node scripts/indexnow.mjs "$RUNNER_TEMP/old-sitemap.xml" public/sitemap.xml
