baseURL = "https://meshcoresverige.se/"
title = "MeshCore Sverige"
locale = "sv"
defaultContentLanguage = "sv"
timeout = "40s"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/sweden-mesh/meshcore-regional-template"

[params]
  # The national site (plan: planning/meshcore-jkp.se/national-site-plan.md in the workspace): every
  # county from data/lan/<scb>.toml, the county chosen in the browser, a front page per county.
  national = true
  lanData = "https://github.com/the-louie/meshcoresverige/blob/main/CONTRIBUTING.md"
  # The site's own repository only (SEO-SV-15, SEO-T3): never a community or chat link.
  sameAs = ["https://github.com/the-louie/meshcoresverige"]
  # County names as people write them (the Sweden Mesh Discord's channels): 301 to the county page (B-360).
  redirects = [
    ["/jonkopings-lan/", "/jönköping/"], ["/jönköpings-län/", "/jönköping/"],
    ["/kalmar-lan/", "/kalmar/"], ["/kalmar-län/", "/kalmar/"],
    ["/orebro-lan/", "/örebro/"], ["/örebro-län/", "/örebro/"],
  ]
  editURL = "https://github.com/the-louie/meshcoresverige/edit/main/"   # "Rätta sidan" on the site's own pages (UX-SV-6)

# No county is fixed here: the visitor's choice decides. Scope "se" until one is chosen. The Sverige map
# reads every map area, SFT too (heard, but no county's; Q7.9: on the Sverige map only).
[params.region]
  scb = ""
  name = "Sverige"
  short = "Sverige"
  iatas = ["BLE", "GOT", "GVX", "HAD", "JKG", "KLR", "KSD", "LLA", "LPI", "MMX", "NYO", "ORB", "OSD", "RNB", "SDL", "STO", "UME", "VBY", "VST", "VXO", "SFT"]
  scope = "se"
  center = [62.5, 16.5]
  zoom = 4.3

[params.naming]
  pattern = ""
  example = ""

# Today's public Beacon API, until the neutral name exists (backlog NATIONAL-7as): the county pages
# and the map read it; only REST and the read-only WebSocket are used.
[params.beacon]
  url = "https://beacon.meshcoresverige.se"
  # One seed list for every map area (Q7.9): beacon.meshat.se, until ours has a year of data.
  seeds = ["https://beacon.meshat.se"]

[params.analytics]
  plausible = true           # Plausible site for meshcoresverige.se, script id in the Pages variable PLAUSIBLE_SCRIPT (NATIONAL-7at);
                             # every event then carries the chosen county as the property lan
  script = "/p/s.js"
  api = "/p/event"

[[params.chats]]
  name = "Sweden Mesh Discord"
  url = "https://discord.gg/gchSzHkPGG"

# Other national links (footer and the Sverige page's Gemenskap column, B-318).
[[params.links]]
  name = "meshat.se"
  url = "https://meshat.se/"
# meshat.se's forum, its MeshCore category (UX-SV-D5, operator 2026-11-18): the place for questions
# that need more than a chat line.
# "Forum" in the Sverige page's Gemenskap column (B-345); the footer keeps the longer name.
[[params.links]]
  name = "Forum"
  footer = "Forumet på meshat.se (MeshCore)"
  url = "https://forum.meshat.se/c/meshcore/6"

[params.contributors]
  repos = ["sweden-mesh/meshcore-regional-template", "the-louie/meshcoresverige"]

[[menus.main]]
  name = "Kom igång"
  pageRef = "/kom-igang"
  weight = 5
[[menus.main]]
  name = "Guider"
  pageRef = "/guider"
  weight = 10
[[menus.main]]
  name = "Steg för steg"
  pageRef = "/wizard"
  weight = 15
[[menus.main]]
  name = "Felsökning"
  pageRef = "/felsokning"
  weight = 17
[[menus.main]]
  name = "Frågor"
  pageRef = "/fragor"
  weight = 18
[[menus.main]]
  name = "Om sidan"
  pageRef = "/om"
  weight = 20

# B-337: the site in English under /en/: the template's content.en/ and this site's content.en/.
# Swedish stays at / with every address unchanged. A further language: one more block like [languages.en]
# and a content.<code>/ folder (here and in the template).
[languages.sv]
  weight = 1
  locale = "sv"
  label = "Svenska"
[languages.en]
  weight = 2
  locale = "en"
  label = "English"
  title = "MeshCore Sweden"
  contentDir = "content.en"
  [languages.en.params.region]
    name = "Sweden"
    short = "Sweden"
  [[languages.en.params.links]]
    name = "meshat.se"
    url = "https://meshat.se/"
  [[languages.en.params.links]]
    name = "Forum"
    footer = "The meshat.se forum (MeshCore, Swedish)"
    url = "https://forum.meshat.se/c/meshcore/6"
  [[languages.en.menus.main]]
    name = "Get started"
    pageRef = "/kom-igang"
    weight = 5
  [[languages.en.menus.main]]
    name = "Guides"
    pageRef = "/guider"
    weight = 10
  [[languages.en.menus.main]]
    name = "Step by step"
    pageRef = "/wizard"
    weight = 15
  [[languages.en.menus.main]]
    name = "Troubleshooting"
    pageRef = "/felsokning"
    weight = 17
  [[languages.en.menus.main]]
    name = "FAQ"
    pageRef = "/fragor"
    weight = 18
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/om"
    weight = 20
